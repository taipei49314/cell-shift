name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: test
        run: npm test

      - name: tsc
        run: npx tsc -b

      - name: vite build
        run: npx vite build

      - name: audit
        run: npm run audit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-pack
          path: artifacts/audit/
          if-no-files-found: warn
