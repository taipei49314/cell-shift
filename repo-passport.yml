apiVersion: repopass.dev/v1alpha1
kind: RepositoryPassport

metadata:
  name: cell-shift
  displayName: CELL//SHIFT
  description: Declared public-ci journey for the Nelson-stack demonstration subject. Spatial agent toy, not a biological model. Live sandbox verify is not claimed on a Windows host or against npm-installed dependencies.
  labels:
    role: public-subject
    flagship: "no"

spec:
  project:
    kind: web-app
    audiences:
      - developer
      - automation
    entrypoints:
      - public-ci

  environments:
    linux-node:
      platform:
        os: linux
        architecture: amd64
      runtime:
        adapter: node
        version: "22.23.1"
      baseImage:
        reference: docker.io/library/node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
      resources:
        cpu: 2
        memory: 2GiB
        disk: 4GiB
        pids: 256

  scenarios:
    public-ci:
      title: Public reproducibility journey
      description: Host CI is npm test, npx tsc -b, npx vite build, npm run audit. This scenario declares that sequence. Network stays denied, so npm ci is expected to fail unless dependencies are already in the snapshot. That gap is recorded, not hidden.
      environment: linux-node
      phases:
        setup:
          timeout: 10m
          steps:
            - id: npm-ci
              run:
                command:
                  - npm
                  - ci
                allowedExitCodes:
                  - 0
        build:
          timeout: 10m
          steps:
            - id: tsc-b
              run:
                command:
                  - npx
                  - tsc
                  - "-b"
                allowedExitCodes:
                  - 0
            - id: vite-build
              run:
                command:
                  - npx
                  - vite
                  - build
                allowedExitCodes:
                  - 0
        exercise:
          timeout: 15m
          driver:
            type: cli
            command:
              - npm
              - test
            assertions:
              - id: npm-test
                exitCode: 0
      capabilities:
        setup:
          network:
            deny: true
          filesystem:
            read:
              - /workspace/**
            write:
              - /workspace/**
              - /outputs/**
        build:
          network:
            deny: true
          filesystem:
            read:
              - /workspace/**
            write:
              - /workspace/**
              - /outputs/**
        exercise:
          network:
            deny: true
          filesystem:
            read:
              - /workspace/**
            write:
              - /workspace/**
              - /outputs/**
      verification:
        repeats: 1
        successThreshold: 1
        requiredObservers:
          - process-exec
          - filesystem-write
          - network-enforcement
          - resource-usage
        cleanup:
          allowedResidue:
            - /outputs/**
            - /workspace/node_modules/**
            - /workspace/dist/**
            - /workspace/artifacts/**

  policies:
    profile: baseline-v1

  evidence:
    profile: minimal-public
    include:
      - verification-summary
      - normalized-observations
    exclude:
      - raw-stdout
      - raw-stderr
      - raw-syscall-trace
